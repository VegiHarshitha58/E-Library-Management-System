<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Releases - E-Library</title>
<link rel="stylesheet" href="new_releases.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>
  <div class="logo">📚 E-Library</div>
  <nav>
    <a href="home.html">Home</a>
    <a href="trending_pdfs.html">Trending PDFs</a>
    <a href="new_releases.html">New Releases</a>
    <a href="categories.html">Categories</a>
    <a href="contributors.html">Contributors</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <span class="tag">🆕 NEW PDF COLLECTION</span>
    <h1>New Releases</h1>
    <p>Recently uploaded study materials, research papers, notes and project reports for students and researchers.</p>
  </div>
</section>
<section class="pdf-section">
  <h2>🆕 Just Added</h2>

  <div class="row-wrapper">

    <button class="arrow left"
      onclick="scrollRow('newReleasesRow')">
      ‹
    </button>

    <div class="pdf-row" id="newReleasesRow">
      <p style="color:#aaa;">Loading...</p>
    </div>

    <button class="arrow right"
      onclick="scrollRow('newReleasesRow')">
      ›
    </button>

  </div>

</section>


<section class="pdf-section">
  <h2>⭐ Popular New Releases</h2>

  <div class="row-wrapper">

    <button class="arrow left"
      onclick="scrollRow('allNewRow')">
      ‹
    </button>

    <div class="pdf-row" id="allNewRow">
      <p style="color:#aaa;">Loading...</p>
    </div>

    <button class="arrow right"
      onclick="scrollRow('allNewRow')">
      ›
    </button>

  </div>

</section>

<script>
const API = "http://127.0.0.1:5000";
const userId = localStorage.getItem("userId");

const favoriteIds = new Set();
const readingListIds = new Set();

function makeCard(pdf) {

    const card =
    document.createElement("div");

    card.className =
    "pdf-card";

    card.innerHTML = `
        <button
class="fav-btn"
onclick="
event.stopPropagation();
toggleFavorite(${pdf.id}, this);
">
<i class="${
favoriteIds.has(pdf.id)
? 'fa-solid fa-heart'
: 'fa-regular fa-heart'
}"></i>
</button>

        <div class="pdf-icon">
            PDF
        </div>

        <h3>
            ${pdf.title}
        </h3>

        <p style="
            font-size:0.8rem;
            color:#aaa;
            margin-top:4px;
        ">
            ${pdf.contributor || "Unknown"}
        </p>

<button
class="list-btn"
onclick="
event.stopPropagation();
toggleReadingList(${pdf.id}, this);
">
<i class="${
readingListIds.has(pdf.id)
? 'fa-solid fa-bookmark'
: 'fa-regular fa-bookmark'
}"></i>
</button>

    `;

    card.onclick = () => {

        openPDF(
            pdf.id,
            pdf.pdf_link,
            pdf.title
        );

    };

    return card;

}

async function openPDF(pdfId, fileUrl, title) {

    const userId =
    localStorage.getItem("userId");

    if(fileUrl && fileUrl !== "null"){

        try{

            await fetch(
                `${API}/pdfs/${pdfId}/view`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        userId:userId
                    })
                }
            );

        }catch(err){

            console.log(err);

        }

      localStorage.setItem(
    "returnPage",
    window.location.href
);

window.location.href =
`reader.html?pdf_id=${pdfId}&file=${fileUrl}&page=1`;

    }else{

        alert(`"${title}" — PDF file not available yet`);

    }

}
// ─── DOWNLOAD PDF ─────────────────────────────────────────────────────────────
async function downloadPDF(pdfId, fileUrl, title) {

    console.log("Download clicked", pdfId);


    try{

        const response = await fetch(
    `${API}/pdfs/${pdfId}/download`,
    {
        method:"POST"
    }
);

console.log(await response.text());
      
    }catch(err){

        console.log(err);

    }

    const a =
    document.createElement("a");

    a.href =
    `${API}/pdf_library/${fileUrl}`;

    a.download =
    title + ".pdf";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

}
async function loadFavoriteIds(){

    try{

        const response =
        await fetch(`${API}/favorites/${userId}`);

        const favorites =
        await response.json();

        favoriteIds.clear();

        favorites.forEach(item=>{

            favoriteIds.add(item.pdf_id);

        });

    }catch(err){

        console.log(err);

    }

}
async function loadReadingListIds(){

    try{

        const response =
        await fetch(`${API}/reading-list/${userId}`);

        const data =
        await response.json();

        readingListIds.clear();

        data.forEach(pdf=>{

            readingListIds.add(pdf.id);

        });

    }catch(err){

        console.log(err);

    }

}
async function toggleFavorite(pdfId, btn){

    try{

        const icon =
        btn.querySelector("i");

        if(favoriteIds.has(pdfId)){

            await fetch(

                `${API}/favorites/user/${userId}/pdf/${pdfId}`,

                {
                    method:"DELETE"
                }

            );

            favoriteIds.delete(pdfId);

            icon.classList.remove("fa-solid");
            icon.classList.add("fa-regular");

        }else{

            await fetch(

                `${API}/favorites`,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        user_id:userId,
                        pdf_id:pdfId

                    })

                }

            );

            favoriteIds.add(pdfId);

            icon.classList.remove("fa-regular");
            icon.classList.add("fa-solid");

        }

    }catch(err){

        console.log(err);

    }

}
async function toggleReadingList(pdfId, btn){

    try{

        const icon =
        btn.querySelector("i");

        if(readingListIds.has(pdfId)){

            await fetch(

                `${API}/reading-list/${userId}/${pdfId}`,

                {
                    method:"DELETE"
                }

            );

            readingListIds.delete(pdfId);

            icon.classList.remove("fa-solid");
            icon.classList.add("fa-regular");

        }else{

            await fetch(

                `${API}/readinglist`,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        user_id:userId,
                        pdf_id:pdfId

                    })

                }

            );

            readingListIds.add(pdfId);

            icon.classList.remove("fa-regular");
            icon.classList.add("fa-solid");

        }

    }catch(err){

        console.log(err);

    }

}
async function loadNewReleases() {
  try {
   const latestRes =
await fetch(`${API}/new-releases`);

const latestPdfs =
await latestRes.json();

const popularRes =
await fetch(`${API}/popular-new-releases`);

const popularPdfs =
await popularRes.json();

    const row1 = document.getElementById("newReleasesRow");
    const row2 = document.getElementById("allNewRow");
    row1.innerHTML = "";
    row2.innerHTML = "";

    if (latestPdfs.length === 0) {
      row1.innerHTML = "<p style='color:#aaa;'>No new releases found.</p>";
      return;
    }

    latestPdfs.slice(0, 8).forEach((pdf, index) => {

    pdf.isNew = index < 3;

    row1.appendChild(makeCard(pdf));

});
    // Rest in second row
    popularPdfs.forEach(pdf => {

    row2.appendChild(makeCard(pdf));

});
   if (popularPdfs.length === 0) {
      row2.innerHTML = "<p style='color:#aaa;'>No more PDFs.</p>";
    }

  } catch (err) {
    document.getElementById("newReleasesRow").innerHTML =
      "<p style='color:#e57373;'>Failed to load. Is the server running?</p>";
  }
}
(async()=>{

    await loadFavoriteIds();

    await loadReadingListIds();

    await loadNewReleases();

})();

function scrollRow(id){

    const row =
    document.getElementById(id);

    row.scrollBy({

        left:row.clientWidth,

        behavior:"smooth"

    });

}
</script>
<script src="notifications-popup.js"></script>
<script src="theme.js"></script>
</body>
</html>
