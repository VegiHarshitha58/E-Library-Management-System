<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Releases - E-Library</title>
<link rel="stylesheet" href="new_releases.css">
</head>
<body>

<header>
  <div class="logo">📚 E-Library</div>
  <nav>
    <a href="home.html">Home</a>
    <a href="trending_pdfs.html">Trending PDFs</a>
    <a href="new_releases.html">New Releases</a>
    <a href="categories.html">Categories</a>
    <a href="contributors.html">Contributors</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <span class="tag">🆕 NEW PDF COLLECTION</span>
    <h1>New Releases</h1>
    <p>Recently uploaded study materials, research papers, notes and project reports for students and researchers.</p>
  </div>
</section>
<section class="pdf-section">
  <h2>🆕 Recently Added PDFs</h2>

  <div class="row-wrapper">

    <button class="arrow left"
      onclick="scrollRow('newReleasesRow',-800)">
      ‹
    </button>

    <div class="pdf-row" id="newReleasesRow">
      <p style="color:#aaa;">Loading...</p>
    </div>

    <button class="arrow right"
      onclick="scrollRow('newReleasesRow',800)">
      ›
    </button>

  </div>

</section>


<section class="pdf-section">
  <h2>📚 All New Uploads</h2>

  <div class="row-wrapper">

    <button class="arrow left"
      onclick="scrollRow('allNewRow',-800)">
      ‹
    </button>

    <div class="pdf-row" id="allNewRow">
      <p style="color:#aaa;">Loading...</p>
    </div>

    <button class="arrow right"
      onclick="scrollRow('allNewRow',800)">
      ›
    </button>

  </div>

</section>

<script>
const API = "http://127.0.0.1:5000";

function makeCard(pdf) {
  const card = document.createElement("div");
  card.className = "pdf-card";
  card.innerHTML = `
    <div class="pdf-icon">PDF</div>
    <h3>${pdf.title}</h3>
    <p style="font-size:0.8rem;color:#aaa;margin-top:4px;">${pdf.contributor || 'Unknown'}</p>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="read-btn" style="flex:1;padding:8px;border:none;border-radius:6px;background:#00c8ff;cursor:pointer;font-size:0.8rem;"
   onclick="openPDF(${pdf.id}, '${pdf.pdf_link}', '${pdf.title}')">Read</button>
      <button class="download-btn" style="flex:1;padding:8px;border:none;border-radius:6px;background:white;cursor:pointer;font-size:0.8rem;"
        onclick="downloadPDF(${pdf.id},'${pdf.pdf_link}', '${pdf.title}')">Download</button>
    </div>
  `;
  return card;
}

async function openPDF(pdfId, fileUrl, title) {

    const userId =
    localStorage.getItem("userId");

    if(fileUrl && fileUrl !== "null"){

        try{

            await fetch(
                `${API}/pdfs/${pdfId}/view`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        userId:userId
                    })
                }
            );

        }catch(err){

            console.log(err);

        }

        window.open(
            `reader.html?pdf_id=${pdfId}&file=${fileUrl}&page=1`,
            "_blank"
        );

    }else{

        alert(`"${title}" — PDF file not available yet`);

    }

}
// ─── DOWNLOAD PDF ─────────────────────────────────────────────────────────────
async function downloadPDF(pdfId, fileUrl, title) {

    console.log("Download clicked", pdfId);


    try{

        const response = await fetch(
    `${API}/pdfs/${pdfId}/download`,
    {
        method:"POST"
    }
);

console.log(await response.text());
      
    }catch(err){

        console.log(err);

    }

    const a =
    document.createElement("a");

    a.href =
    `${API}/pdf_library/${fileUrl}`;

    a.download =
    title + ".pdf";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

}
async function loadNewReleases() {
  try {
    const res = await fetch(`${API}/new-releases`);
    const pdfs = await res.json();

    const row1 = document.getElementById("newReleasesRow");
    const row2 = document.getElementById("allNewRow");
    row1.innerHTML = "";
    row2.innerHTML = "";

    if (pdfs.length === 0) {
      row1.innerHTML = "<p style='color:#aaa;'>No new releases found.</p>";
      return;
    }

    // First 6 in top row
    pdfs.slice(0, 6).forEach(pdf => row1.appendChild(makeCard(pdf)));

    // Rest in second row
    pdfs.slice(6).forEach(pdf => row2.appendChild(makeCard(pdf)));

    if (pdfs.length <= 6) {
      row2.innerHTML = "<p style='color:#aaa;'>No more PDFs.</p>";
    }

  } catch (err) {
    document.getElementById("newReleasesRow").innerHTML =
      "<p style='color:#e57373;'>Failed to load. Is the server running?</p>";
  }
}

loadNewReleases();

function scrollRow(id, amount){

  document.getElementById(id).scrollBy({

    left: amount,

    behavior: "smooth"

  });

}
</script>
<script src="notifications-popup.js"></script>

</body>
</html>
