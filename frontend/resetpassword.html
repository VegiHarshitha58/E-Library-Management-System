<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - E-Library</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:url('images/library.jpeg') no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
}

.overlay{
width:90%;
max-width:1000px;
height:85vh;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(8px);
border-radius:12px;
box-shadow:0 0 30px rgba(0,0,0,0.6);

display:flex;
justify-content:center;
align-items:center;
}

.reset-box{
width:100%;
max-width:400px;
color:white;
text-align:center;
}

.icon{
font-size:50px;
margin-bottom:15px;
}

.reset-box h1{
font-size:42px;
font-weight:300;
margin-bottom:15px;
}

.reset-box p{
color:#ddd;
margin-bottom:30px;
line-height:1.5;
}

.password-box{
position:relative;
margin-bottom:20px;
}

.password-box input{
width:100%;
background:transparent;
border:none;
border-bottom:1px solid white;
padding:12px 40px 12px 10px;
color:white;
outline:none;
font-size:15px;
}

.password-box input::placeholder{
color:#ddd;
}

.password-box input:focus{
border-bottom:2px solid #00c8ff;
}

.toggle-password{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

.btn{
width:100%;
padding:12px;
border:none;
background:#1976d2;
color:white;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
background:#0d5db8;
}

#message{
min-height:24px;
margin-top:15px;
font-size:14px;
font-weight:600;
text-align:center;
}

.back-link{
margin-top:25px;
}

.back-link a{
color:#00c8ff;
text-decoration:none;
}

.back-link a:hover{
text-decoration:underline;
}

.password-note{
display:block;
text-align:left;
color:#ccc;
margin-top:8px;
font-size:12px;
}

</style>

</head>

<body>

<div class="overlay">

<div class="reset-box">

<div class="icon">🔐</div>

<h1>Reset Password</h1>

<p>
Create a new password for your account.
</p>

<form id="resetForm">

<div class="password-box">

<input
type="password"
id="newPassword"
placeholder="New Password"
required>

<i class="fa-solid fa-eye-slash toggle-password"
onclick="togglePassword('newPassword',this)"> </i>

</div>

<small class="password-note">
Minimum 8 characters, 1 uppercase letter and 1 number
</small>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<i class="fa-solid fa-eye-slash toggle-password"
onclick="togglePassword('confirmPassword',this)"> </i>

</div>

<button
type="submit"
class="btn"
id="resetBtn">
Reset Password
</button>

</form>

<p id="message"></p>

<div class="back-link">
<a href="login.html">← Back to Login</a>
</div>

</div>

</div>

<script>
if(sessionStorage.getItem("resetAllowed") !== "true"){
 alert("Unauthorized access.");
    window.location.href = "forgotpassword.html";

}
function togglePassword(id,icon){

const input =
document.getElementById(id);

if(input.type === "password"){

input.type = "text";

icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");

}
else{

input.type = "password";

icon.classList.remove("fa-eye");
icon.classList.add("fa-eye-slash");

}

}

document.getElementById("resetForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const newPassword =
document.getElementById("newPassword").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const email =
localStorage.getItem("resetEmail");

const message =
document.getElementById("message");
const resetBtn =
document.getElementById("resetBtn");

resetBtn.disabled = true;
resetBtn.innerText = "Updating...";
message.innerText = "";

if(!email){

message.style.color =
"#ff7b7b";

message.innerText =
"Unauthorized password reset";
resetBtn.disabled = false;
resetBtn.innerText = "Reset Password";
return;
}

if(newPassword !== confirmPassword){

message.style.color =
"#ff7b7b";

message.innerText =
"Passwords do not match";
resetBtn.disabled = false;
resetBtn.innerText = "Reset Password";
return;

}

const passwordPattern =
/^(?=.*[A-Z])(?=.*\d).{8,}$/;

if(!passwordPattern.test(newPassword)){

message.style.color =
"#ff7b7b";

message.innerText =
"Password needs 8 characters, 1 uppercase and 1 number";
resetBtn.disabled = false;
resetBtn.innerText = "Reset Password";
return;

}

try{

const response =
await fetch(
"http://localhost:5000/reset-password",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
email,
password:newPassword
})
}
);

const data =
await response.json();

if(data.success){

message.style.color =
"#7CFC98";

message.innerText =
"✓ Password Updated Successfully. Redirecting to Login...";


localStorage.removeItem(
"resetEmail"
);
sessionStorage.removeItem("resetAllowed");

setTimeout(()=>{

window.location.href =
"login.html";

},1500);

}
else{

message.style.color =
"#ff7b7b";

message.innerText =
data.message;
resetBtn.disabled = false;
resetBtn.innerText = "Reset Password";
}

}
catch(error){

message.style.color =
"#ff7b7b";

message.innerText =
"Server Connection Failed";

console.log(error);
resetBtn.disabled = false;
resetBtn.innerText = "Reset Password";

}

});

</script>

</body>
</html>
