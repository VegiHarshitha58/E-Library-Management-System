<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library Settings</title>

    <link rel="stylesheet" href="settings.css">
</head>

<body>

    <div class="settings-container">

        <h1>Settings</h1>

        <div class="settings-card">

            <h2>Reading Experience</h2>

            <div class="setting-row">
                <span>Dark Mode</span>

                <label class="switch">
                    <input type="checkbox" id="darkMode">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Continuous Scrolling</span>

                <label class="switch">
                    <input type="checkbox" id="continuousScroll">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Enable Bookmarks</span>
                <label class="switch">
                    <input type="checkbox" id="enableBookmarks">
                    <span class="slider"></span>
                </label>
            </div>

        </div>

        <div class="settings-card">

            <h2>Reading Progress</h2>

            <div class="setting-row">
                <span>Auto Save Progress</span>

                <label class="switch">
                    <input type="checkbox" id="autoSave">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Remember Last Page</span>

                <label class="switch">
                    <input type="checkbox" id="rememberPage">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Reading Progress Bar</span>

                <label class="switch">
                    <input type="checkbox" id="progressBar">
                    <span class="slider"></span>
                </label>
            </div>

        </div>

        <button class="save-btn" onclick="saveSettings()">
            Save Changes
        </button>

        <div id="statusMessage"></div>

    </div>

<script>

function saveSettings() {

    const button =
        document.querySelector(".save-btn");

    button.disabled = true;
    button.innerText = "Saving...";

    const data = {

        user_id: localStorage.getItem("userId"),

        dark_mode:
            document.getElementById("darkMode").checked,

        auto_save_progress:
            document.getElementById("autoSave").checked,

        remember_last_page:
            document.getElementById("rememberPage").checked,

        continuous_scrolling:
            document.getElementById("continuousScroll").checked,

        
            enable_bookmarks:
    document.getElementById("enableBookmarks").checked,

        reading_progress_bar:
            document.getElementById("progressBar").checked

    };
    

    fetch("http://localhost:5000/save-settings", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

    })

    .then(response => response.text())

    .then(message => {

        const status =
            document.getElementById("statusMessage");
if(data.dark_mode){

    localStorage.setItem(
        "theme",
        "dark"
    );

}else{

    localStorage.setItem(
        "theme",
        "light"
    );

}
        status.innerHTML =
            "✓ Settings saved successfully";

        button.disabled = false;
        button.innerText = "Save Changes";

        setTimeout(() => {

        window.location.href = "home.html";

    }, 1000);



    })

    .catch(error => {

        console.error(error);

        const status =
            document.getElementById("statusMessage");

        status.innerHTML =
            "✗ Unable to connect to server";

        button.disabled = false;
        button.innerText = "Save Changes";

    });

}

window.onload = function() {

    const userId = localStorage.getItem("userId");

fetch(`http://localhost:5000/get-settings/${userId}`)

    .then(response => response.json())

    .then(data => {

        document.getElementById("darkMode").checked =
            data.dark_mode == 1;

        document.getElementById("autoSave").checked =
            data.auto_save_progress == 1;

        document.getElementById("rememberPage").checked =
            data.remember_last_page == 1;

        document.getElementById("continuousScroll").checked =
            data.continuous_scrolling == 1;

        document.getElementById("enableBookmarks").checked =
    data.enable_bookmarks == 1;

        document.getElementById("progressBar").checked =
            data.reading_progress_bar == 1;

    })

    .catch(error => {

        console.error(error);

    });

};

</script>
<script src="theme.js"></script>

</body>
</html>
