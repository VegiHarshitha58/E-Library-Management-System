<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending PDFs - E-Library</title>
<link rel="stylesheet" href="trending_pdfs.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .hero-content h1 { font-size: 42px; }
  .hero-content p { margin-top: 10px; line-height: 1.7; }
  .stats span { font-size: 0.9rem; }
  .pdf-card { display: flex; flex-direction: column; justify-content: space-between; height: auto; min-height: 200px; }
  .pdf-card-btns { display: flex; gap: 8px; margin-top: 10px; }
  .pdf-card-btns button {
    flex: 1; padding: 7px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.78rem; font-weight: 600;
  }
  .btn-read { background: #00c8ff; color: black; }
  .btn-download { background: white; color: black; }
  .btn-read:hover, .btn-download:hover { opacity: 0.85; }
  .views-badge {
    display: inline-block; background: #e53935;
    color: white; font-size: 0.7rem; font-weight: 700;
    padding: 2px 8px; border-radius: 10px; margin-bottom: 6px;
  }
  .rank-badge {
    position: absolute; top: 10px; left: 10px;
    background: #00c8ff; color: black;
    font-size: 0.75rem; font-weight: 700;
    padding: 3px 10px; border-radius: 10px;
  }
  .pdf-card { position: relative; }
  .loading { color: #aaa; padding: 20px; font-size: 0.95rem; }
  .hero-skeleton { opacity: 0.5; }
</style>
</head>
<body>

<header>
  <div class="logo">📚 E-Library</div>
  <nav>
    <a href="home.html">Home</a>
    <a href="trending_pdfs.html">Trending PDFs</a>
    <a href="new_releases.html">New Releases</a>
    <a href="categories.html">Categories</a>
    <a href="contributors.html">Contributors</a>
  </nav>
  
</header>

<!-- HERO — shows #1 trending PDF -->
<section class="hero" id="heroSection">
  <div class="hero-content" id="heroContent">
    <span class="tag">⭐ Library's Most Popular PDF</span>
    <h1 id="heroTitle">Loading...</h1>
    <p id="heroDesc">Fetching the most viewed PDF...</p>
    <div class="stats" id="heroStats"></div>
    <div class="buttons" id="heroButtons"></div>
  </div>
</section>

<!-- MOST VIEWED -->
<section class="pdf-section">
  <h2>🔥 Most Viewed PDFs</h2>

  <div class="row-wrapper">

<button class="arrow left"
onclick="scrollRow('mostViewedRow')">
‹
</button>
    <div class="pdf-row" id="mostViewedRow">
      <p class="loading">Loading...</p>
    </div>
<button class="arrow right"
onclick="scrollRow('mostViewedRow')">
›
</button>
    

  </div>

</section>
<!-- TOP 10 TRENDING -->
<section class="pdf-section">
  <h2>📈 Top 10 Trending This Week</h2>

  <div class="row-wrapper">
    <button class="arrow left"
onclick="scrollRow('top10Row')">
‹
</button>
    <div class="pdf-row" id="top10Row">
      <p class="loading">Loading...</p>
    </div>
<button class="arrow right"
onclick="scrollRow('top10Row')">
›
</button>

  </div>

</section>


<script>
const favoriteIds = new Set();
const readingListIds = new Set();
const API = "https://e-library-backend-43db.onrender.com";

// ─── OPEN PDF & INCREMENT VIEW COUNT ─────────────────────────────────────────
async function openPDF(pdfId, fileUrl, title) {


  const userId = localStorage.getItem("userId");

  if (fileUrl && fileUrl !== 'null' && fileUrl !== 'undefined') {

    try {

      await fetch(`${API}/pdfs/${pdfId}/view`, {

        method: 'POST',

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          userId: userId
        })

      });

    } catch(e) {}

   localStorage.setItem(
    "returnPage",
    "trending_pdfs.html"
);

window.location.href =
`reader.html?pdf_id=${pdfId}&file=${fileUrl}&page=1`;
  } else {

    alert(`"${title}" — PDF file not available yet`);

  }
}

// ─── DOWNLOAD PDF ─────────────────────────────────────────────────────────────
async function downloadPDF(pdfId, fileUrl, title) {

    try{

        await fetch(
            `${API}/pdfs/${pdfId}/download`,
            {
                method:"POST"
            }
        );

    }catch(err){

        console.log(err);

    }

    const a =
    document.createElement("a");

    a.href =
    `${API}/pdf_library/${fileUrl}`;

    a.download =
    title + ".pdf";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

}
const userId = localStorage.getItem("userId");

async function toggleFavorite(pdfId, btn) {

    try {

        if (favoriteIds.has(pdfId)) {

            await fetch(
                `${API}/favorites/user/${userId}/pdf/${pdfId}`,
                {
                    method: "DELETE"
                }
            );

            favoriteIds.delete(pdfId);

const icon = btn.querySelector("i");

icon.classList.remove("fa-solid");
icon.classList.add("fa-regular");

        } else {

            await fetch(`${API}/favorites`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    user_id: userId,
                    pdf_id: pdfId

                })

            });

            favoriteIds.add(pdfId);

const icon = btn.querySelector("i");

icon.classList.remove("fa-regular");
icon.classList.add("fa-solid");
        }

    } catch (err) {

        console.log(err);

    }

}
async function toggleReadingList(pdfId, btn){

    try{

        const icon =
        btn.querySelector("i");

        if(readingListIds.has(pdfId)){

            await fetch(

                `${API}/reading-list/${userId}/${pdfId}`,

                {
                    method:"DELETE"
                }

            );

            readingListIds.delete(pdfId);

            icon.classList.remove("fa-solid");
            icon.classList.add("fa-regular");

        }else{

            await fetch(

                `${API}/readinglist`,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        user_id:userId,
                        pdf_id:pdfId

                    })

                }

            );

            readingListIds.add(pdfId);

            icon.classList.remove("fa-regular");
            icon.classList.add("fa-solid");

        }

    }catch(err){

        console.log(err);

    }

}
// ─── MAKE PDF CARD ────────────────────────────────────────────────────────────
function makeCard(pdf, rank) {

    const card =
    document.createElement("div");

    card.className =
    "pdf-card";

    card.innerHTML = `

        ${rank ?
        `<div class="rank-badge">#${rank}</div>`
        : ""}
<button
class="fav-btn"
onclick="
event.stopPropagation();
toggleFavorite(${pdf.id}, this);
">
<i class="${favoriteIds.has(pdf.id)
    ? 'fa-solid fa-heart'
    : 'fa-regular fa-heart'}"></i>
</button>

        <div class="pdf-icon">
            PDF
        </div>

        <div>

            <span class="views-badge">
                👁 ${pdf.views || 0} views
            </span>

            <h3>
                ${pdf.title}
            </h3>

            <p style="
                font-size:0.8rem;
                color:#aaa;
                margin-top:4px;
            ">
                ${pdf.contributor || "Unknown"}
            </p>

        </div>
        <button
class="list-btn"
onclick="
event.stopPropagation();
toggleReadingList(${pdf.id}, this);
">
<i class="${
readingListIds.has(pdf.id)
? 'fa-solid fa-bookmark'
: 'fa-regular fa-bookmark'
}"></i>
</button>
    `;

    card.onclick = () => {

        openPDF(
            pdf.id,
            pdf.pdf_link,
            pdf.title
        );

    };

    return card;

}

// ─── LOAD HERO (TOP TRENDING PDF) ─────────────────────────────────────────────
function loadHero(topPDF) {
  if (!topPDF) return;
  document.getElementById('heroTitle').textContent = topPDF.title;
  document.getElementById('heroDesc').textContent =
    topPDF.description || `By ${topPDF.contributor || 'Unknown'} — Most viewed PDF in the library.`;
  document.getElementById('heroStats').innerHTML = `
    <span>👁 ${topPDF.views || 0} Views</span>
    <span>📄 ${topPDF.contributor || 'Unknown'}</span>
  `;
  document.getElementById('heroButtons').innerHTML = `
    <button class="read-btn"
    onclick="openPDF(${topPDF.id}, '${topPDF.pdf_link}', '${topPDF.title}')">
        Read PDF
    </button>
`;
}
async function loadFavoriteIds() {

    try {

        const response = await fetch(`${API}/favorites/${userId}`);

        const favorites = await response.json();

        favoriteIds.clear();

        favorites.forEach(item => {

            favoriteIds.add(item.pdf_id);

        });

    } catch (err) {

        console.log(err);

    }

}
async function loadReadingListIds(){

    try{

        const response =
        await fetch(`${API}/reading-list/${userId}`);

        const data =
        await response.json();

        readingListIds.clear();

        data.forEach(pdf=>{

            readingListIds.add(pdf.id);

        });

    }catch(err){

        console.log(err);

    }

}

// ─── LOAD ALL TRENDING DATA ────────────────────────────────────────────────────
async function loadTrending() {
  try {
    const mostViewedRes =
await fetch(`${API}/trending`);

const mostViewed =
await mostViewedRes.json();

const weeklyRes =
await fetch(`${API}/trending-week`);

const weekly =
await weeklyRes.json();

    if (mostViewed.length === 0) {
    document.getElementById("mostViewedRow").innerHTML =
        '<p class="loading">No trending PDFs yet.</p>';
    return;
}

    // Hero = #1 most viewed
    loadHero(mostViewed[0]);

    // Most Viewed row — top 8
    const mostViewedRow = document.getElementById('mostViewedRow');
    mostViewedRow.innerHTML = '';
   mostViewed.slice(1, 9).forEach((pdf, i) => {
    mostViewedRow.appendChild(makeCard(pdf, i + 2));
});
    // Top 10 row — next 10
    const top10Row = document.getElementById('top10Row');
    top10Row.innerHTML = '';
    weekly.forEach((pdf, i) => {
    top10Row.appendChild(makeCard(pdf, i + 1));
});

  } catch (err) {
    document.getElementById('mostViewedRow').innerHTML =
      '<p class="loading" style="color:#e57373;">Failed to load. Is the server running?</p>';
    document.getElementById('heroTitle').textContent = 'Server not connected';
    document.getElementById('heroDesc').textContent = 'Please make sure your backend server is running on port 5000.';
  }
}




function scrollRow(id){

    const row = document.getElementById(id);

    row.scrollBy({

        left: row.clientWidth,

        behavior:"smooth"

    });

}
(async () => {

    await loadFavoriteIds();
await loadReadingListIds();
   await loadTrending();

})();
</script>
<script src="notifications-popup.js"></script>
<script src="theme.js"></script>
</body>
</html>
