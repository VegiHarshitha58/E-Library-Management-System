<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Library Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    background:url('images/library.jpeg') no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    width:90%;
    max-width:1200px;
    height:90vh;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(8px);
    box-shadow:0 0 30px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    padding-left:120px;
    border-radius:8px;
}

.login-box{
    width:100%;
    max-width:350px;
    color:white;
}

.login-box h1{
    font-size:50px;
    font-weight:300;
    margin-bottom:10px;
}

.login-box p{
    margin-bottom:40px;
    color:#ddd;
}

.input-group{
    margin-bottom:20px;
    position:relative;
}

.input-group input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid white;
    padding:10px 35px 10px 0;
    color:white;
    outline:none;
    font-size:15px;
}

.input-group input::placeholder{
    color:#ddd;
}

/* Professional focus effect */
.input-group input:focus{
    border-bottom:2px solid #00c8ff;
}

.toggle-password{
    position:absolute;
    right:5px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
    color:white;
}

.remember{
    margin-bottom:20px;
    font-size:14px;
}

.remember label{

    display:flex;

    align-items:center;

    gap:8px;

    cursor:pointer;

}

.remember input{

    width:16px;
    height:16px;

}

.btn{
    width:100%;
    padding:12px;
    border:none;
    background:#1976d2;
    color:white;
    cursor:pointer;
    border-radius:8px;
    font-size:16px;
    transition:0.3s;
}

.btn:hover{
    background:#0d5db8;
    transform:translateY(-2px);
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:14px;
}

.links a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.links a:hover{
    color:#4da3ff;
}

@media(max-width:768px){

    .overlay{
        padding:30px;
        justify-content:center;
    }

    .login-box{
        max-width:100%;
    }

    .login-box h1{
        font-size:40px;
    }

    .links{
        flex-direction:column;
        gap:10px;
    }
}

.signup-text{

    text-align:center;


    margin-top:20px;

    font-size:14px;

    color:#ddd;

}

.signup-text a{

    color:#00c8ff;

    text-decoration:none;

    font-weight:600;

}

.signup-text a:hover{

    text-decoration:underline;

}

#message{
    min-height:22px;
    margin-top:12px;
    text-align:center;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.3px;
}
</style>
</head>
<body>

<div class="overlay">

<div class="login-box">

<h1>Welcome Back</h1>

<p>Access your PDFs, favorites and reading history.</p>

<form id="loginForm">

<div class="input-group">
<input
type="email"
id="username"
autocomplete="email"
placeholder="Email Address"
required>

</div>

<div class="input-group">

<input
type="password"
id="password"
autocomplete="current-password"
placeholder="Password"
required>

<span
class="toggle-password"
onclick="togglePassword()">

<i class="fa-solid fa-eye-slash"></i>

</span>
</div>

<div class="remember">

    <label>
        <input type="checkbox" id="rememberMe">
        Remember Me
    </label>

</div>

<button
type="submit"
class="btn"
id="loginBtn">
LOGIN
</button><p id="message"></p>


</form>

<div class="links">

    <a href="forgotpassword.html">Forgot Password?</a>

</div>

<div class="signup-text">

    Don't have an account?
    <a href="register.html">Create Account</a>

</div>

</div>

</div>
<script>

function togglePassword(){

    let password =
    document.getElementById("password");

    let eyeIcon =
    document.querySelector(".toggle-password i");

    if(password.type === "password"){

        password.type = "text";

        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");

    }else{

        password.type = "password";

        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    }
}

document.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value;

    const message =
    document.getElementById("message");

    message.innerText = "";

    if(username === "" || password === ""){

        message.style.color = "#ff7b7b";

        message.innerText =
        "Please fill all fields";

        return;
    }

    const btn =
    document.getElementById("loginBtn");

    btn.innerHTML = "Logging In...";

    btn.disabled = true;

    try{

        const response = await fetch(
            "http://localhost:5000/login",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data =
        await response.json();

        if(data.message === "Login Successful"){

            message.style.color =
            "#7CFC98";

            message.innerText =
            "✓ Login Successful";

            localStorage.setItem(
                "userId",
                data.userId
            );

            localStorage.setItem(
                "userName",
                data.userName
            );

            localStorage.setItem(
                "email",
                data.email
            );
        if(data.avatar){

    localStorage.setItem(
        "userAvatar",
        `http://127.0.0.1:5000/${data.avatar}`
    );

}
            /* REMEMBER ME */

            if(document.getElementById("rememberMe").checked){

                localStorage.setItem(
                    "rememberedEmail",
                    username
                );

            }else{

                localStorage.removeItem(
                    "rememberedEmail"
                );

            }
document.getElementById("password").value = "";
            setTimeout(() => {

                window.location.href =
                "home.html";

            }, 1000);

        }
        else{

    message.style.color =
    "#ff7b7b";

    message.innerText =
    data.message;

    document.getElementById(
        "password"
    ).value = "";

}
    }
    catch(error){

        message.style.color =
        "#ff7b7b";

        message.innerText =
        "Server Connection Failed";

        console.log(error);

    }

    btn.innerHTML = "LOGIN";

    btn.disabled = false;

});

/* LOAD SAVED LOGIN DETAILS */

window.onload = function(){

    const savedEmail =
    localStorage.getItem(
        "rememberedEmail"
    );

    

    if(savedEmail){

        document.getElementById(
            "username"
        ).value = savedEmail;

        document.getElementById(
            "rememberMe"
        ).checked = true;

    }

};

</script>

</body>
</html>
