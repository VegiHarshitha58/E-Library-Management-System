<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Library Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{

    --bg:#0b1120;
    --surface:#111827;
    --surface2:#1f2937;
    --text:#ffffff;
    --muted:#9ca3af;
    --border:#374151;

    --gold:#c89b3c;
    --gold-light:#e6c36a;
    --burgundy:#7a1f3d;
    --accent:#9b274d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'DM Sans',sans-serif;
    position:relative;
    overflow-x:hidden;
    color:var(--text);
    transition:.3s;
}

body::after{
    content:'❧';
    position:fixed;
    bottom:30px;
    right:40px;
    font-size:48px;
    color:var(--gold);
    opacity:.15;
    pointer-events:none;
    z-index:0;
}

.profile-container{

    position:relative;
    z-index:1;

    width:95%;
    max-width:1000px;

    background:var(--surface);

    padding:30px 40px;

    border-radius:16px;

    border:1px solid var(--border);

    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.profile-header{
    text-align:center;
    margin-bottom:24px;
}

.avatar-container{
    position:relative;
    display:inline-block;
    cursor:pointer;
}

.avatar-container::after{

    content:'✎';

    position:absolute;

    bottom:-2px;
    right:-2px;

    width:28px;
    height:28px;

    background:var(--burgundy);

    color:var(--gold-light);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;

    z-index:2;

    box-shadow:0 2px 8px rgba(0,0,0,.25);

    transition:.2s;
}

.avatar-container:hover::after{
    background:var(--accent);
}

.avatar{

    width:100px;
    height:100px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid var(--border);

    display:block;

    transition:.3s;
}

.avatar-container:hover .avatar{
    filter:brightness(.9) sepia(.1);
}

.profile-header h2{

    margin-top:18px;

    color:var(--text);

    font-family:'Playfair Display',serif;

    font-size:22px;

    font-weight:700;
}

.profile-header p{

    color:var(--muted);

    margin-top:5px;

    font-size:14px;
}

.divider{

    width:60px;

    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );

    margin:20px auto 0;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{

    display:block;

    margin-bottom:8px;

    font-weight:500;

    font-size:11px;

    letter-spacing:.12em;

    text-transform:uppercase;

    color:var(--muted);
}

.form-group input,
.form-group textarea{

    width:100%;

    padding:13px 16px;

    border:1px solid var(--border);

    border-radius:8px;

    font-size:15px;

    background:var(--surface2);

    color:var(--text);
}

.form-group input:focus,
.form-group textarea:focus{

    border-color:var(--accent);

    background:var(--surface2);

    box-shadow:0 0 0 3px rgba(155,39,77,.25);
}

.form-group textarea{
    resize:none;
    line-height:1.6;
}

.save-btn{

    width:100%;

    padding:12px;

    border:none;

    border-radius:8px;

    background:linear-gradient(
        135deg,
        #7a1f3d,
        #9b274d
    );

    color:white;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;

    box-shadow:0 4px 16px rgba(122,31,61,.35);
}

.save-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 8px 24px rgba(122,31,61,.45);
}

.avatar-menu{

    position:absolute;

    top:140px;

    left:50%;

    transform:translateX(-50%);

    background:var(--surface);

    border-radius:12px;

    box-shadow:0 8px 25px rgba(0,0,0,.15);

    display:none;

    flex-direction:column;

    overflow:hidden;

    z-index:1000;

    min-width:170px;
}

.avatar-menu button{

    border:none;

    background:var(--surface);

    color:var(--text);

    padding:12px 18px;

    text-align:left;

    cursor:pointer;

    font-size:14px;
}

.avatar-menu button:hover{
    background:var(--surface2);
}

#removePhotoBtn{
    color:#e53935;
}

.back-btn{

    background:none;

    border:none;

    color:var(--burgundy);

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    margin-bottom:20px;

    display:flex;

    align-items:center;

    gap:6px;
}

.back-btn:hover{
    color:var(--accent);
}

.initials-avatar{

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--burgundy);

    color:white;

    font-size:36px;

    font-weight:bold;

    overflow:hidden;
}

#email{

    background:var(--surface);

    color:var(--muted);

    cursor:not-allowed;
}

/* Light Mode */

body.light-mode{

    --bg:#f5f5f5;
    --surface:#ffffff;
    --surface2:#f3f4f6;
    --text:#111111;
    --muted:#6b7280;
    --border:#d1d5db;
}
</style>
</head>

<body>

<div class="profile-container">
<button id="backBtn" class="back-btn">
    ← Back
</button>
    <div class="profile-header">

        <label for="avatarInput" class="avatar-container">
            <div id="avatarPreview" class="avatar initials-avatar">
</div>
        </label>

        <input
            type="file"
            id="avatarInput"
            accept="image/*"
            hidden>
<div class="avatar-menu" id="avatarMenu">

    <button id="changePhotoBtn">
        Change Photo
    </button>

    <button id="removePhotoBtn">
        Remove Photo
    </button>

</div>
        <h2 id="displayName">Priscilla John</h2>
        <p id="displayEmail">priscilla@example.com</p>
        <div class="divider"></div>

    </div>

    <form id="profileForm">

        <div class="form-group">
            <label>Name</label>
            <input
                type="text"
                id="name"
                value="Priscilla John">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
    type="email"
    id="email"
    readonly>

        <div class="form-group">
            <label>Bio</label>
            <textarea
                id="bio"
                rows="4">the war is jehovas.</textarea>
        </div>

        <button type="submit" class="save-btn">
            Save Changes
        </button>
    </form>

</div>

<script>
    const API = "https://e-library-backend-43db.onrender.com";

// Load profile from backend when page opens
window.onload = function() {
    loadProfile();
    // Load saved avatar if exists
    const savedAvatar = localStorage.getItem("userAvatar");
    if (savedAvatar) {
        document.getElementById("avatarPreview").src = savedAvatar;
    }
};
function showInitials(name){

    const avatar =
    document.getElementById("avatarPreview");

    const initials = name
        .split(" ")
        .map(word => word[0])
        .join("")
        .toUpperCase();

    avatar.innerHTML = initials;

}
function loadProfile() {

    const userId = localStorage.getItem("userId");

    fetch(`${API}/api/profile/${userId}`)
    .then(response => response.json())
    .then(data => {
       const avatar =
document.getElementById("avatarPreview");

if(data.avatar){

    const avatarUrl =
    `${API}/${data.avatar}`;

    avatar.innerHTML =
    `<img src="${avatarUrl}"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:50%;
          ">`;

    localStorage.setItem(
        "userAvatar",
        avatarUrl
    );

}
else{

    showInitials(data.name);

}

        document.getElementById("name").value =
            data.name || "";

        document.getElementById("email").value =
            data.email || "";

        document.getElementById("bio").value =
            data.bio || "";

        document.getElementById("displayName").innerText =
            data.name || "";

        document.getElementById("displayEmail").innerText =
            data.email || "";

    })
    .catch(error => {
        console.error("Error loading profile:", error);
    });

}


// Avatar preview
const avatarInput =
document.getElementById("avatarInput");

const avatarPreview =
document.getElementById("avatarPreview");

avatarInput.addEventListener("change", async function() {
    const file = this.files[0];
    if (!file) return;

    // Preview immediately
    const reader = new FileReader();
    reader.onload = function(e) {
        avatarPreview.src = e.target.result;
        localStorage.setItem("userAvatar", e.target.result);
    };
    reader.readAsDataURL(file);

    // Upload to server
    try {
        const formData = new FormData();
formData.append("avatar", file);

const userId = localStorage.getItem("userId");
formData.append("userId", userId);

        const res = await fetch("http://127.0.0.1:5000/api/profile/avatar", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        localStorage.setItem(
    "userAvatar",
    `${API}/$/${data.avatar}`
);
        alert("Profile picture updated! ✅");

    } catch(err) {
        console.error(err);
        alert("Failed to upload image");
    }
});

// Save profile to database
document
.getElementById("profileForm")
.addEventListener(
"submit",
function(e){

    e.preventDefault();

    const profileData = {

    userId: localStorage.getItem("userId"),

    name: document.getElementById("name").value,

    email: document.getElementById("email").value,

    bio: document.getElementById("bio").value

};

    fetch(
        `${API}//api/profile`,
        {
            method: "PUT",

            headers: {
                "Content-Type":
                "application/json"
            },

            body:
            JSON.stringify(profileData)
        }
    )
    .then(response => response.json())
    .then(data => {

        document.getElementById("displayName")
        .innerText =
        profileData.name;

        document.getElementById("displayEmail")
        .innerText =
        profileData.email;

        alert(data.message);

    })
    .catch(error => {

        console.error(error);

        alert(
            "Error updating profile"
        );

    });

});

const avatarContainer =
document.querySelector(".avatar-container");

const avatarMenu =
document.getElementById("avatarMenu");

avatarContainer.addEventListener("click", function(e){

    e.preventDefault();

    if(
        avatarMenu.style.display === "flex"
    ){
        avatarMenu.style.display = "none";
    }
    else{
        avatarMenu.style.display = "flex";
    }

});

document.addEventListener("click", function(e){

    if(
        !avatarContainer.contains(e.target) &&
        !avatarMenu.contains(e.target)
    ){
        avatarMenu.style.display = "none";
    }

});
document
.getElementById("changePhotoBtn")
.addEventListener("click", function(){

    document
    .getElementById("avatarInput")
    .click();

});
document
.getElementById("removePhotoBtn")
.addEventListener("click", async function(){

    const userId =
    localStorage.getItem("userId");

    const response =
    await fetch(

        `${API}/api/profile/avatar/${userId}`,

        {
            method:"DELETE"
        }

    );

    const data =
    await response.json();

    localStorage.removeItem(
        "userAvatar"
    );
    location.reload();

    alert(data.message);

    location.reload();

});
document
.getElementById("backBtn")
.addEventListener("click", () => {

    if(document.referrer){
        history.back();
    }else{
        window.location.href = "home.html";
    }

});
</script>
<script src="theme.js"></script>
</body>
</html>
