<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Browse Books</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
}

button{
    padding:12px 20px;
    background:#e50914;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.book-card{
    background:#222;
    border-radius:12px;
    padding:15px;
}

.book-card img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:8px;
}

.book-card h3{
    margin:10px 0;
}

.book-card p{
    color:#aaa;
    font-size:14px;
}

.preview-btn{
    display:inline-block;
    margin-top:10px;
    padding:8px 12px;
    background:#00c8ff;
    color:black;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}
.back-btn{
    display:inline-block;
    margin-bottom:10px;
    color:#00c8ff;
    text-decoration:none;
    font-size:15px;
    font-weight:600;
}

.back-btn:hover{
    text-decoration:underline;
}
</style>
</head>

<body>


<a href="#" class="back-btn" onclick="history.back(); return false;">
    ← Back
</a>
<h1>📚 Browse Books</h1>

<div class="search-box">

<input
type="text"
id="keyword"
placeholder="Search books..."
autocomplete="off">

<button
id="searchBtn"
onclick="searchBooks()">
Search
</button>

</div>

<div id="results"></div>

<script>




async function searchBooks(){

    const keyword =
    document.getElementById("keyword").value.trim();

    if(!keyword) return;
    const btn =
document.getElementById("searchBtn");

btn.disabled = true;
btn.innerText = "Searching...";

    const results =
    document.getElementById("results");

    results.innerHTML = `
    <div style="
        color:white;
        text-align:center;
        font-size:18px;
        padding:40px;
    ">
        🔍 Searching books...
    </div>
    `;

    try{

        const response =
        await fetch(
            `http://localhost:5000/browse-books?keyword=${encodeURIComponent(keyword)}`
        );

        if(!response.ok){
            throw new Error("Server Error");
        }

        const books =
        await response.json();

        results.innerHTML = "";

        if(books.length === 0){

            results.innerHTML = `
            <div style="
                color:#aaa;
                text-align:center;
                padding:40px;
                font-size:18px;
            ">
                📚 No books found
            </div>
            `;
            btn.disabled = false;
btn.innerText = "Search";

            return;
        }

        books.forEach(book => {

            const coverId =
            book.cover_i;

            results.innerHTML += `

            <div class="book-card">

                <img
                src="${
                    coverId
                    ? `https://covers.openlibrary.org/b/id/${coverId}-L.jpg`
                    : 'https://via.placeholder.com/250x350?text=No+Cover'
                }">

                <h3>
                    ${book.title || 'No Title'}
                </h3>

                <p>
                    ${
                        book.author_name
                        ? book.author_name.join(', ')
                        : 'Unknown Author'
                    }
                </p>

                <p>
                    First Published:
                    ${book.first_publish_year || 'N/A'}
                </p>

                <a
                class="preview-btn"
                href="https://openlibrary.org${book.key}"
                target="_blank">

                    Read Details

                </a>

            </div>

            `;

        });
 btn.disabled = false;
    btn.innerText = "Search";
    }
    catch(err){

        console.error(err);

        results.innerHTML = `
        <div style="
            color:#ff6b6b;
            text-align:center;
            padding:40px;
            font-size:18px;
        ">
            ❌ Failed to load books. Please try again.
        </div>
        `;
 btn.disabled = false;
    btn.innerText = "Search";
    }

}
document
.getElementById("keyword")
.addEventListener(
    "keypress",
    function(e){

        if(e.key === "Enter"){

            searchBooks();

        }

    }
);
window.onload = () => {

    document.getElementById("keyword")
    .value = "Programming";

    searchBooks();

};
</script>

</body>
</html>
