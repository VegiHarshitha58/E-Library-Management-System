<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - E-Library</title>

<link rel="stylesheet" href="notifications.css">
</head>

<body>

<header>

<div class="logo">
📚 E-Library
</div>

<nav>
<a href="home.html">Home</a>
<a href="categories.html">Categories</a>
<a href="contributors.html">Contributors</a>
<a href="notifications.html">Notifications</a>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<span class="tag">
🔔 UPDATES
</span>

<h1>Notifications</h1>

<p>
Stay updated with new uploads, contributors,
research papers, and library announcements.
</p>

</div>

</section>

<section class="notifications" id="notificationsContainer">

</section>
<script>

const userId =
localStorage.getItem("userId");

fetch(
`http://localhost:5000/notifications/${userId}`
)
.then(response => response.json())

.then(data => {

    const container =
    document.getElementById("notificationsContainer");

    container.innerHTML = "";
data.forEach(item => {

    let icon = "🔔";

    if(item.type === "new_pdf")
        icon = "📄";

    if(item.type === "reading_reminder")
        icon = "📚";

    if(item.type === "recommendation")
        icon = "⭐";
    if(item.type === "welcome")
    icon = "🎉";
if(item.type === "welcome_back")
    icon = "🌷";

    container.innerHTML += `

   <div class="notification-card"
onclick="openNotification(
    ${item.id},
    '${item.pdf_link}',
    ${item.pdf_id}
)"
>
        <h3>${icon} Notification</h3>

        <p>${item.message}</p>

        <span>${item.created_at}</span>

    </div>

    `;

});
    
})

.catch(error => {

    console.error(error);

});
async function openNotification(
    notificationId,
    file,
    pdfId
){

    await fetch(

        `http://localhost:5000/notifications/read/${notificationId}`,

        {
            method:"POST"
        }

    );

    if(!file) return;

    window.location.href =
    `reader.html?pdf_id=${pdfId}&file=${file}&page=1`;

}

</script>
</body>
</html>
