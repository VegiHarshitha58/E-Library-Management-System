<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favorites</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    padding:30px;
}

h1{
    margin-bottom:30px;
    font-size:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#181818;
    border-radius:15px;
    padding:20px;
    position:relative;
    text-align:center;
}

.pdf-icon{
    width:70px;
    height:70px;
    background:#e53935;
    margin:0 auto 20px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:22px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#999;
    margin-bottom:20px;
}

.remove{
    position:absolute;
    top:12px;
    right:12px;

    width:32px;
    height:32px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,0.1);
    color:white;

    cursor:pointer;
    font-size:18px;
}

.remove:hover{
    background:rgba(255,255,255,0.2);
}

</style>

</head>

<body>

<h1>❤️ My Favorites</h1>

<div
class="grid"
id="favGrid">
</div>

<script>

const userId =
localStorage.getItem("userId");

const grid =
document.getElementById("favGrid");

async function loadFavorites(){

    try{

        const response =
        await fetch(
        "http://localhost:5000/favorites"
        );

        const data =
        await response.json();

        const userFavorites =
        data.filter(
        item => item.user_id == userId
        );

        if(userFavorites.length === 0){

            grid.innerHTML =
            "<p>No Favorites Yet ❤️</p>";

            return;
        }

        grid.innerHTML = "";

        userFavorites.forEach(pdf => {

            grid.innerHTML += `

            <div class="card">

                <button
                class="remove"
                onclick="removeFavorite(${pdf.id})">

                    ✕

                </button>

                <div class="pdf-icon">
                    PDF
                </div>

                <h3>
                    ${pdf.title}
                </h3>

                <p>
                    ${pdf.contributor}
                </p>

            </div>

            `;

        });

    }
    catch(error){

        console.log(error);

    }

}

async function removeFavorite(id){

    const confirmDelete =
    confirm(
    "Remove from Favorites?"
    );

    if(!confirmDelete){

        return;

    }

    try{

        await fetch(

        `http://localhost:5000/favorites/${id}`,

        {
            method:"DELETE"
        }

        );

        alert(
        "Favorite Removed"
        );

        loadFavorites();

    }
    catch(error){

        console.log(error);

    }

}

loadFavorites();

</script>

</body>
</html>
