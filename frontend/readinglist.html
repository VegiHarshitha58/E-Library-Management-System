<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reading List</title>

<link rel="stylesheet" href="readinglist.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        📚 E-Library
    </div>

    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="trending_pdfs.html">Trending PDFs</a>
        <a href="new_releases.html">New Releases</a>
        <a href="categories.html">Categories</a>
        <a href="contributors.html">Contributors</a>
    </div>

</nav>

<div class="container">

    <div class="header">
        <h1 id="readingListTitle">
            My Reading List
        </h1>
    </div>

    <div
    class="books-grid"
    id="readingListContainer">
    </div>

</div>

<script>

const userId =
localStorage.getItem("userId");

console.log(
"User ID:",
userId
);

const container =
document.getElementById(
"readingListContainer"
);

const title =
document.getElementById(
"readingListTitle"
);

let toastTimer;

function showToast(msg){

    let toast =
    document.getElementById("toast");

    if(!toast){

        toast =
        document.createElement("div");

        toast.id = "toast";

        toast.style.position = "fixed";
        toast.style.bottom = "20px";
        toast.style.right = "20px";

        toast.style.background =
        "#22c55e";

        toast.style.color =
        "white";

        toast.style.padding =
        "12px 18px";

        toast.style.borderRadius =
        "10px";

        toast.style.fontWeight =
        "600";

        toast.style.zIndex =
        "9999";

        toast.style.boxShadow =
        "0 4px 12px rgba(0,0,0,0.3)";

        document.body.appendChild(toast);

    }

    toast.innerText = msg;

    toast.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.style.display = "none";

    }, 2500);

}

async function loadReadingList(){

    try{

        const response =
        await fetch(
        `http://localhost:5000/reading-list/${userId}`
        );

        const data =
        await response.json();

        console.log(data);

        title.innerText =
        `My Reading List (${data.length})`;

        if(data.length === 0){

            container.innerHTML = `
<div class="empty-state">

    <div class="empty-icon">
        <i class="fa-regular fa-bookmark"></i>
    </div>

    <h2>Your Reading List is Empty</h2>

    <p>
        Bookmark PDFs to read later.
    </p>

    <a href="academic_collection.html" class="browse-btn">
        Browse PDFs
    </a>

</div>
`;

            return;
        }

        container.innerHTML = "";

        data.forEach(pdf => {

            container.innerHTML += `

<div
class="book-card"
onclick="openPdf(${pdf.id}, '${pdf.pdf_link}')">

    <button
    class="remove-btn"
    onclick="
    event.stopPropagation();
    removeFromReadingList(${pdf.id});
    ">
        ✕
    </button>

    <div class="pdf-icon">
        PDF
    </div>

    <h3>
        ${pdf.title}
    </h3>

    <p>
        ${pdf.contributor}
    </p>

</div>

`;

        });

    }
    catch(error){

        console.log(error);

        container.innerHTML = `
            <h2>
                Failed to load Reading List
            </h2>
        `;

    }

}

async function removeFromReadingList(pdfId){

    const confirmDelete =
    confirm(
    "Remove this PDF from Reading List?"
    );

    if(!confirmDelete){

        return;

    }

    try{

        const response =
        await fetch(
        `http://localhost:5000/reading-list/${userId}/${pdfId}`,
        {
            method:"DELETE"
        });

        const data =
        await response.json();

        showToast(
            data.message ||
            "Removed Successfully"
        );

        loadReadingList();

    }
    catch(error){

        console.log(error);

        showToast(
            "Failed to remove PDF"
        );

    }

}

function openPdf(pdfId, pdfLink){

    localStorage.setItem(
    "returnPage",
    "readinglist.html"
);

window.location.href =
`reader.html?pdf_id=${pdfId}&file=${pdfLink}&page=1`;
}

loadReadingList();

</script>
<script src="notifications-popup.js"></script>
<script src="theme.js"></script>
</body>
</html>
