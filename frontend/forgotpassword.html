<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - E-Library</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    background:url('images/library.jpeg') no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    width:90%;
    max-width:1000px;
    height:80vh;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(8px);
    border-radius:12px;
    box-shadow:0 0 30px rgba(0,0,0,0.6);

    display:flex;
    justify-content:center;
    align-items:center;
}

.forgot-box{
    width:100%;
    max-width:400px;
    color:white;
    text-align:center;
}

.forgot-box h1{
    font-size:42px;
    font-weight:300;
    margin-bottom:15px;
}

.forgot-box p{
    color:#ddd;
    margin-bottom:30px;
    line-height:1.5;
}

.input-group{
    margin-bottom:20px;
}

.input-group input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid white;
    padding:12px;
    color:white;
    outline:none;
    font-size:15px;
}

.input-group input::placeholder{
    color:#ddd;
}

.input-group input:focus{
    border-bottom:2px solid #00c8ff;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    background:#1976d2;
    color:white;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#0d5db8;
}

#message{
    min-height:24px;
    margin-top:15px;
    font-size:14px;
    font-weight:500;
}

.back-link{
    margin-top:25px;
}

.back-link a{
    color:#00c8ff;
    text-decoration:none;
}

.back-link a:hover{
    text-decoration:underline;
}
.icon{
    font-size:50px;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="overlay">

    <div class="forgot-box">
<div class="icon">
    🔐
</div>
        <h1>Forgot Password?</h1>

        <p>
We'll help you reset your account password.
</p>

        <form id="forgotForm">

            <div class="input-group">
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Registered Email"
                    required>
            </div>

            <button
    type="submit"
    class="btn"
    id="continueBtn">
    Continue
</button>

        </form>

        <p id="message"></p>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>

    </div>

</div>

<script>

document.getElementById("forgotForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
    document.getElementById("email").value.trim();

    const message =
    document.getElementById("message");
const continueBtn =
document.getElementById("continueBtn");

continueBtn.disabled = true;
continueBtn.innerText = "Verifying...";
    message.innerText = "";

    if(email === ""){

        message.style.color = "#ff7b7b";

        message.innerText =
        "Please enter your email";

        return;
    }

    try{

        const response =
        await fetch(
            "http://localhost:5000/check-email",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    email
                })
            }
        );

        const data =
        await response.json();
if(data.exists){

    localStorage.setItem(
        "resetEmail",
        email
    );

    // Allow access to reset password page
    sessionStorage.setItem(
        "resetAllowed",
        "true"
    );

    message.style.color =
    "#7CFC98";

    message.innerText =
    "✓ Email Verified";

    setTimeout(() => {

        window.location.href =
        "resetpassword.html";

    },1000);

}


else{

            message.style.color =
            "#ff7b7b";

            message.innerText =
            "Email not found";
            continueBtn.disabled = false;
continueBtn.innerText = "Continue";

        }

    }
    catch(error){

        message.style.color =
        "#ff7b7b";

        message.innerText =
        "Server Connection Failed";

        console.log(error);
continueBtn.disabled = false;
continueBtn.innerText = "Continue";
    }

});

</script>

</body>
</html>
