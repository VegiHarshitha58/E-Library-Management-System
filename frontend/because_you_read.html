href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<header>

<div class="logo">
📚 E-Library
</div>

<nav>
<a href="home.html">Home</a>

<a href="new_releases.html">New Releases</a>

<div class="search-box">
<input
type="text"
id="searchInput"
placeholder="Search PDFs...">
<i class="fas fa-search"></i>
</div>

</header>

<section class="hero">

<div class="hero-content">

<span class="tag">
📚 RECOMMENDED FOR YOU
</span>

<h1>Recently Added PDFs</h1>

<p>
Discover the latest PDFs added to the library.
Perfect for exploring new resources and study materials.
</p>

<div class="stats">
<span>🆕 Latest PDFs</span>
<span>📚 Fresh Content</span>
<span>🎓 Study Resources</span>
</div>

</div>

</section>

<section class="pdf-section">

<h2>📚 Recommended For You</h2>
<div class="row-wrapper">

    <button class="arrow left" id="recommendedLeft">
        ❮
    </button>

    <div class="pdf-row" id="recommendedContainer"></div>

    <button class="arrow right" id="recommendedRight">
        ❯
    </button>

</div>
</div>

</section>
<script src="pdf-card.js"></script>
<script>
const API = "https://e-library-backend-43db.onrender.com";

const userId = localStorage.getItem("userId");

const favoriteIds = new Set();

const readingListIds = new Set();


    
async function loadRecommended() {

    const response =
    await fetch(`${API}/recommended-all/${userId}`);

    const data =
    await response.json();

    const container =
    document.getElementById("recommendedContainer");

    container.innerHTML = "";

    data.forEach(pdf => {

        container.appendChild(
            makeCard(pdf)
        );

    });

}
(async()=>{

    await loadFavoriteIds();

    await loadReadingListIds();

    await loadRecommended();

})();
document.getElementById("recommendedLeft")
.addEventListener("click", () => {

    document.getElementById("recommendedContainer")
    .scrollBy({
        left: -500,
        behavior: "smooth"
    });

});

document.getElementById("recommendedRight")
.addEventListener("click", () => {

    document.getElementById("recommendedContainer")
    .scrollBy({
        left: 500,
        behavior: "smooth"
    });

});
</script>

<script src="search-pages.js"></script>
<script src="theme.js"></script>
<script src="notifications-popup.js"></script>
</body>
</html>
