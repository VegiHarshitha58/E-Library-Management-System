<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>PDF Reader</title>

<style>
body {
    margin: 0;
    background: #0d0d0d;
    font-family: Arial;
    color: white;
}

.topbar {
    height: 55px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 15px;
    justify-content: space-between;
    
}

.back-btn {
    background: #e50914;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

iframe {
    width: 100%;
    height: calc(100vh - 55px);
    border: none;
}
</style>
</head>

<body>

<div class="topbar">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div id="title">PDF Reader</div>

<div style="display:flex; gap:10px; align-items:center;">

    <button
        id="downloadBtn"
        onclick="downloadPDF()"
        style="
            background:#2563eb;
            border:none;
            padding:6px 10px;
            border-radius:4px;
            color:white;
            cursor:pointer;
            font-weight:bold;
        ">
        ⬇ Download
    </button>

    <button
        id="bookmarkBtn"
        onclick="saveBookmark()"
        style="
            background:#f5c542;
            border:none;
            padding:6px 10px;
            border-radius:4px;
            cursor:pointer;
            font-weight:bold;
        ">
        ⭐ Bookmark
    </button>

</div>
</button>
    <div id="progress">Page 1</div>
</div>

<div style="text-align:center; margin-top:10px;">
    <button onclick="prevPage()">⬅ Prev</button>

    <span id="pageInfo">
        Page 1 / 1
    </span>

    <button onclick="nextPage()">Next ➡</button>
</div>

<canvas
    id="pdfCanvas"
    style="
        display:block;
        margin:auto;
        background:white;
        margin-top:10px;
    ">
</canvas>

<script>

const params = new URLSearchParams(window.location.search);

let pdfFile = params.get("file");
let pdfId = Number(params.get("pdf_id"));
let page = parseInt(params.get("page")) || 1;

let userId = localStorage.getItem("userId") || 1;
console.log("Saving History", userId, pdfId);
fetch("http://localhost:5000/reading-history", {

    method: "POST",

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({
        userId: userId,
        pdfId: pdfId
    })

})
.then(res => res.text())
.then(data => console.log(data))
.catch(err => console.log(err));



    let enableBookmark = true;


    
    // ⭐ IMPORTANT: after settings load, load bookmark/resume
    loadSavedPage();

/* -----------------------------
   LOAD SETTINGS (resume mode)
------------------------------*/

fetch("http://localhost:5000/get-settings/" + userId)
.then(res => res.json())
.then(data => {
enableBookmark = data.enable_bookmarks == 1;
    
    const btn = document.getElementById("bookmarkBtn");

    if (enableBookmark) {
        btn.style.display = "inline-block";
        btn.innerText = "⭐ Bookmark";
    } else {
        btn.style.display = "none";

        document.getElementById("progress").innerText =
            "Bookmarks Disabled in Settings";
    }

});
            

        

/* -----------------------------
   SAVE PROGRESS (REAL)
------------------------------*/

let currentPage = page;

async function saveProgress() {

    const settingsRes =
    await fetch(
        `http://localhost:5000/get-settings/${userId}`
    );

    const settings =
    await settingsRes.json();

    if(settings.auto_save_progress != 1){
        return;
    }

    fetch(
        "http://localhost:5000/api/progress/update",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                user_id:userId,
                pdf_id:pdfId,
                last_page:currentPage,
                total_pages:totalPages

            })

        }
    );

}

function loadSavedPage() {

    fetch(
        `http://localhost:5000/get-settings/${userId}`
    )
    .then(res => res.json())
    .then(settings => {

        // If bookmarks enabled check bookmark first
        if(settings.enable_bookmarks == 1){

            let savedBookmark =
            localStorage.getItem(
                "bookmark_pdf_" + pdfId
            );

            if(savedBookmark){

                currentPage =
                parseInt(savedBookmark);

                document.getElementById("progress").innerText =
                "⭐ Bookmark Page " + currentPage;

                return;
            }

        }

        // If remember last page enabled
        if(settings.remember_last_page == 1){

            fetch(
                `http://localhost:5000/api/progress/${userId}/${pdfId}`
            )
            .then(res => res.json())
            .then(data => {

                if(data.last_page){

                    currentPage =
                    data.last_page;

                    document.getElementById("progress").innerText =
                    "📌 Resumed Page " + currentPage;

                }

            });

        }
        else{

            currentPage = 1;

        }

    })
    .catch(err => console.log(err));

}
function goBack() {

    const returnPage =
    localStorage.getItem("returnPage");

    if(returnPage){

        window.location.href =
        returnPage;

        return;
    }

    history.back();

}

function saveBookmark() {

    if (!enableBookmark) {
        alert("Bookmarks are disabled in Settings");
        return;
    }

    localStorage.setItem(
        "bookmark_pdf_" + pdfId,
        currentPage
    );

    document.getElementById("progress").innerText =
        "⭐ Bookmarked Page " + currentPage + " (Saved)";

    alert("Bookmark saved at page " + currentPage);
}
let pdfDoc = null;
let totalPages = 0;

const canvas =
document.getElementById("pdfCanvas");

const ctx =
canvas.getContext("2d");
async function downloadPDF() {

    try {

        await fetch(
            `http://localhost:5000/pdfs/${pdfId}/download`,
            {
                method: "POST"
            }
        );

    } catch(err) {

        console.log(err);

    }

    window.location.href =
        `http://localhost:5000/download/${encodeURI(pdfFile)}`;

}

async function loadPDF() {

    const pdfUrl =
    "http://localhost:5000/pdf_library/" +
    pdfFile;

    pdfDoc =
    await pdfjsLib.getDocument(pdfUrl).promise;

    totalPages =
    pdfDoc.numPages;

    renderPage(currentPage);

}

async function renderPage(pageNum) {

    const page =
    await pdfDoc.getPage(pageNum);

    const viewport =
    page.getViewport({ scale: 1.5 });

    canvas.width =
    viewport.width;

    canvas.height =
    viewport.height;

    await page.render({
        canvasContext: ctx,
        viewport: viewport
    }).promise;

    document.getElementById("pageInfo")
    .innerText =
    `Page ${pageNum} / ${totalPages}`;

    document.getElementById("progress")
    .innerText =
    `${Math.round((pageNum / totalPages) * 100)}%`;

    saveProgress();

}
function nextPage(){

    if(currentPage >= totalPages)
        return;

    currentPage++;

    renderPage(currentPage);

}
function prevPage(){

    if(currentPage <= 1)
        return;

    currentPage--;

    renderPage(currentPage);

}

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script>
  loadPDF();
</script>
<script src="theme.js"></script>
</body>
</html>
