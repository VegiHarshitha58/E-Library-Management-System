<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>PDF Reader</title>

<style>
body {
    margin: 0;
    background: #0d0d0d;
    font-family: Arial;
    color: white;
}

.topbar {
    height: 55px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 15px;
    justify-content: space-between;
    
}

.back-btn {
    background: #e50914;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

iframe {
    width: 100%;
    height: calc(100vh - 55px);
    border: none;
}
</style>
</head>

<body>

<div class="topbar">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div id="title">PDF Reader</div>

<div style="display:flex; gap:10px; align-items:center;">

    <button
        id="downloadBtn"
        onclick="downloadPDF()"
        style="
            background:#2563eb;
            border:none;
            padding:6px 10px;
            border-radius:4px;
            color:white;
            cursor:pointer;
            font-weight:bold;
        ">
        ⬇ Download
    </button>

    <button
        id="bookmarkBtn"
        onclick="saveBookmark()"
        style="
            background:#f5c542;
            border:none;
            padding:6px 10px;
            border-radius:4px;
            cursor:pointer;
            font-weight:bold;
        ">
        ⭐ Bookmark
    </button>
    <button
id="autoBtn"
onclick="toggleAutoScroll()"
style="
background:#10b981;
border:none;
padding:6px 10px;
border-radius:4px;
color:white;
cursor:pointer;
font-weight:bold;
">
▶ Auto
</button>
 <div id="speedControl" style="display:none; align-items:center; gap:8px;">

    <label style="font-size:14px;">Speed</label>

    <input
        type="range"
        id="speedSlider"
        min="1"
        max="10"
        value="3"
    >

    <span id="speedValue">3x</span>

</div>
</div>
</button>
    <div id="progress">Page 1</div>
</div>
<div
    id="pdfContainer"
    style="
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:20px;
        margin-top:15px;
    ">
</div>

<script>

const params = new URLSearchParams(window.location.search);

let pdfFile = params.get("file");
let pdfId = Number(params.get("pdf_id"));
let page = parseInt(params.get("page")) || 1;

let userId = localStorage.getItem("userId") || 1;
console.log("Saving History", userId, pdfId);
fetch("http://localhost:5000/reading-history", {

    method: "POST",

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({
        userId: userId,
        pdfId: pdfId
    })

})
.then(res => res.text())
.then(data => console.log(data))
.catch(err => console.log(err));



    let enableBookmark = true;


   
    // ⭐ IMPORTANT: after settings load, load bookmark/resume
/* -----------------------------
   LOAD SETTINGS (resume mode)
------------------------------*/

fetch("http://localhost:5000/get-settings/" + userId)
.then(res => res.json())
.then(data => {
enableBookmark = data.enable_bookmarks == 1;
    
    const btn = document.getElementById("bookmarkBtn");

    if (enableBookmark) {
        btn.style.display = "inline-block";
        btn.innerText = "⭐ Bookmark";
    } else {
        btn.style.display = "none";

        document.getElementById("progress").innerText =
            "Bookmarks Disabled in Settings";
    }

});
            

      let toastTimer;

function showToast(message, color = "#22c55e") {

    let toast = document.getElementById("toast");

    if (!toast) {

        toast = document.createElement("div");

        toast.id = "toast";

        toast.style.position = "fixed";
        toast.style.bottom = "20px";
        toast.style.right = "20px";
        toast.style.background = color;
        toast.style.color = "white";
        toast.style.padding = "12px 18px";
        toast.style.borderRadius = "10px";
        toast.style.fontWeight = "600";
        toast.style.zIndex = "9999";
        toast.style.boxShadow = "0 4px 12px rgba(0,0,0,0.3)";

        document.body.appendChild(toast);
    }

    toast.style.background = color;
    toast.innerText = message;
    toast.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.style.display = "none";

    },2500);

}  

/* -----------------------------
   SAVE PROGRESS (REAL)
------------------------------*/

let currentPage = page;

async function saveProgress() {

    const settingsRes =
    await fetch(
        `http://localhost:5000/get-settings/${userId}`
    );

    const settings =
    await settingsRes.json();

    if(settings.auto_save_progress != 1){
        return;
    }

    fetch(
        "http://localhost:5000/api/progress/update",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                user_id:userId,
                pdf_id:pdfId,
                last_page:currentPage,
                total_pages:totalPages

            })

        }
    );

}

 async function loadSavedPage(){

    const settingsRes =
    await fetch(
        `http://localhost:5000/get-settings/${userId}`
    );

    const settings =
    await settingsRes.json();

    if(settings.enable_bookmarks == 1){

        const savedBookmark =
        localStorage.getItem(
            "bookmark_pdf_" + pdfId
        );

        if(savedBookmark){

            currentPage =
            parseInt(savedBookmark);

            return;
        }

    }

    if(settings.remember_last_page == 1){

        const res =
        await fetch(
            `http://localhost:5000/api/progress/${userId}/${pdfId}`
        );

        const data =
        await res.json();

        if(data.last_page){

            currentPage =
            data.last_page;

        }
    }

}
function goBack() {

    const returnPage =
    localStorage.getItem("returnPage");

    if(returnPage){

        window.location.href =
        returnPage;

        return;
    }

    history.back();

}

function saveBookmark() {

    if (!enableBookmark) {
      showToast(
    "Bookmarks are disabled in Settings",
    "#ef4444"
);  
        return;
    }

const visiblePage =
document.elementFromPoint(
    window.innerWidth/2,
    120
)?.dataset?.page || currentPage;

localStorage.setItem(
    "bookmark_pdf_" + pdfId,
    visiblePage
);

    document.getElementById("progress").innerText =
"⭐ Bookmarked Page " + visiblePage + " (Saved)";

showToast("⭐ Bookmark saved at Page " + visiblePage);
}
let pdfDoc = null;
let totalPages = 0;
let isRestoringPage = true;
let autoScrolling = false;
let autoScrollFrame = null;
let lastScrollTimestamp = null;
let scrollRemainder = 0;
let scrollSpeed = 3;
const speedSlider =
document.getElementById("speedSlider");

const speedValue =
document.getElementById("speedValue");

const speedControl =
document.getElementById("speedControl");

speedSlider.addEventListener("input", () => {

    scrollSpeed =
    parseInt(speedSlider.value);

    speedValue.innerText =
    scrollSpeed + "x";

});
const container =
document.getElementById("pdfContainer");
async function downloadPDF() {

    try {

        await fetch(
            `http://localhost:5000/pdfs/${pdfId}/download`,
            {
                method: "POST"
            }
        );

    } catch(err) {

        console.log(err);

    }

    window.location.href =
        `http://localhost:5000/download/${encodeURI(pdfFile)}`;

}

async function loadPDF() {

    const pdfUrl =
    "http://localhost:5000/pdf_library/" +
    pdfFile;

    pdfDoc =
    await pdfjsLib.getDocument(pdfUrl).promise;

    totalPages =
    pdfDoc.numPages;

    const settingsRes =
    await fetch(`http://localhost:5000/get-settings/${userId}`);

    const settings =
    await settingsRes.json();
    await loadSavedPage();
    document.getElementById("autoBtn").style.display =
settings.continuous_scrolling == 1
? "inline-block"
: "none";

    document.getElementById("progress").style.display =
settings.reading_progress_bar == 1
? "block"
: "none";

  
await renderAllPages();
if(settings.continuous_scrolling == 1){

    speedControl.style.display = "flex";

    startAutoScroll();

}else{

    speedControl.style.display = "none";

}
}
async function renderAllPages() {

    container.innerHTML = "";
for (let i = 1; i <= totalPages; i++) {

    const pdfPage = await pdfDoc.getPage(i);

    const viewport = pdfPage.getViewport({ scale: 1.5 });

    const canvas = document.createElement("canvas");
    canvas.dataset.page = i;
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    container.appendChild(canvas);

    await pdfPage.render({
        canvasContext: canvas.getContext("2d"),
        viewport
    }).promise;

    // Jump immediately when the saved page is rendered
    if (i === currentPage) {
        canvas.scrollIntoView({
            block: "start"
        });

        isRestoringPage = false;
    }


    }

const pageInfo = document.getElementById("pageInfo");

if(pageInfo){
    pageInfo.innerText = `Pages 1 - ${totalPages}`;
}

    document.getElementById("progress").innerText =
    `Continuous Scrolling Enabled`;
}
function scrollToPage(pageNumber){

    const page =
    document.querySelector(
        `canvas[data-page="${pageNumber}"]`
    );

    if(page){

        page.scrollIntoView({
    behavior: "instant",
    block: "start"


        });

    }

}
function scrollStep(timestamp){

    if(!autoScrolling) return;

    if(lastScrollTimestamp !== null){

        const elapsed =
        timestamp - lastScrollTimestamp;

        const exactPixels =
        (scrollSpeed / 100) * elapsed + scrollRemainder;

        const wholePixels =
        Math.floor(exactPixels);

        scrollRemainder =
        exactPixels - wholePixels;

        if(wholePixels > 0){

            window.scrollBy(0, wholePixels);

        }

    }

    lastScrollTimestamp = timestamp;

    autoScrollFrame =
    requestAnimationFrame(scrollStep);

}

function startAutoScroll(){

    stopAutoScroll();

    autoScrolling = true;

    lastScrollTimestamp = null;

    scrollRemainder = 0;

    autoScrollFrame =
    requestAnimationFrame(scrollStep);

}

function stopAutoScroll(){

    autoScrolling = false;

    if(autoScrollFrame){

        cancelAnimationFrame(autoScrollFrame);

        autoScrollFrame = null;

    }

}
function toggleAutoScroll(){

    const btn =
    document.getElementById("autoBtn");

    if(autoScrolling){

        stopAutoScroll();

        btn.innerText =
        "▶ Auto";

    }else{

        startAutoScroll();

        btn.innerText =
        "⏸ Pause";

    }

}
function updateCurrentPage(){
    if(isRestoringPage){
    return;
}

    const pages =
    document.querySelectorAll(
        "#pdfContainer canvas"
    );

    let visible = 1;

    pages.forEach(page=>{

        const rect =
        page.getBoundingClientRect();

        if(rect.top <= 120 && rect.bottom >= 120){

            visible =
            Number(page.dataset.page);

        }

    });

    currentPage = visible;

    document.getElementById("progress").innerText =
    `Page ${visible} of ${totalPages}
    (${Math.round(visible*100/totalPages)}%)`;

    saveProgress();

}
window.addEventListener(
    "scroll",
    updateCurrentPage
);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script>
  loadPDF();
</script>
<script src="theme.js"></script>
</body>
</html>
